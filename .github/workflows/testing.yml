name: Testing Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Godot Tests (GdUnit4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: "4.7-stable"

      - name: Cache GdUnit4 addon
        uses: actions/cache@v4
        with:
          path: game/isla-ancestral/addons/gdUnit4
          key: gdunit4-${{ hashFiles('game/isla-ancestral/addons/gdUnit4/**') }}
          restore-keys: |
            gdunit4-

      # T-M112 / BUG-120 (fix autorizado por el director, msg 59, 2026-10-08).
      # Defectos corregidos:
      #   1) `--path res://tests` NO es un flag de GdUnit4 (lo consumia Godot)
      #      y sin `-a` el parser no encontraba suites -> 0 tests ejecutados.
      #   2) `|| true` anulaba cualquier fallo -> este paso NUNCA podia fallar
      #      (falso-verde de CI, la misma clase de bug que BUG-120 en local).
      # Invocacion verificada localmente (Godot 4.7.2, igual que run_tests.gd v2c):
      #   -a <dir> por suite + --ignoreHeadlessMode. Nota: sin ese flag GdUnit
      #   sale con codigo 103 ("Headless mode is not supported").
      # Alcance de este job: SOLO las 4 suites GdUnit4 del repo (21 test cases,
      # 21/21 al 2026-10-07). Las 22 suites `extends SceneTree` NO son GdUnit4:
      # las cubre res://tests/run_tests.gd en local (ver 11-BUGS -> BUG-120).
      # Sin `|| true`: si una suite GdUnit4 falla, este paso y el quality-gate
      # fallan a la vista (CI rojo-visible > CI verde-falso).
      - name: Run tests
        run: |
          cd game/isla-ancestral
          godot --headless -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            -a res://tests/unit/foto \
            -a res://tests/unit/inventario \
            -a res://tests/unit/ui \
            -a res://tests/unit/debug \
            --ignoreHeadlessMode 2>&1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            game/isla-ancestral/user://gdunit-*.xml
            game/isla-ancestral/tests/output/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: game/isla-ancestral/user://coverage/

  lint:
    name: GDScript Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: "4.7-stable"

      # BUG-122 RESUELTO (frente B, 2026-10-08, mimo-v2.6-flash-free; decision
      # y autorizacion del director, msg 70 del canal): "el job lint debe ser
      # honesto: o funciona o no existe".
      #
      # Historico (mismo dia 02:30, Log 1453): al quitar los `|| true` (msg 61)
      # ambos pasos quedaron honestos pero INAPTOS y ese estado intermedio se
      # retiro ahora:
      #   - `Check formatting`: `godot --headless --check-only` SIN `--script`
      #     NO valida nada (arranca el juego completo) -> COLGABA hasta el
      #     timeout de 10 min en cada push/PR.
      #   - `Run static analysis (CodeQualityCheck)`: `code_quality_check.gd`
      #     es un EditorScript -> 2 ERROR estructurales SIEMPRE; nunca corrio
      #     en CI.
      #
      # Estado actual (medido en local, Godot 4.7.2, 2026-10-08):
      #   1. Paso de parseo (reemplaza a "Check formatting"): la receta ya
      #      probada en quality.yml (BUG-051/BUG-091) - generador del colector
      #      (un preload por cada .gd del proyecto), `--import` para la cache
      #      de class_names y conteo de SCRIPT ERROR como gate duro. Medido:
      #      colector 971 preloads, 0 SCRIPT ERROR, EXIT 0, termina en
      #      segundos. NOTA honesta: esto valida PARSEO, no estilo - un check
      #      de formato real exigiria un formatter (gdtoolkit/gdformat) que el
      #      proyecto no tiene instalado; esa decision le corresponde a M118.
      #      El nombre del paso dice exactamente lo que hace.
      #   2. Paso de analisis estatico: RETIRADO con evidencia en vez de
      #      dejarlo fallando siempre. Adaptarlo exige modificar
      #      scripts/editor/code_quality_check.gd (archivo de M111): sonda
      #      medida, ni siquiera un wrapper SceneTree puede instanciarlo en
      #      headless ("Class 'EditorScript' can only be instantiated by
      #      editor" + "Can't inherit from a virtual class"). La
      #      reintegracion queda pendiente de coordinacion director <-> M111
      #      (ver 11-BUGS -> BUG-122).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate syntax collector
        run: python tools/quality/gen_colector_sintaxis.py --proyecto game/isla-ancestral

      - name: Import project resources
        run: godot --headless --path game/isla-ancestral --import

      - name: Check GDScript parse (gate duro)
        run: |
          cd game/isla-ancestral
          LINT_LOG=$(mktemp)
          godot --headless --check-only --script res://scripts/editor/_colector_sintaxis.gd > "$LINT_LOG" 2>&1
          cat "$LINT_LOG"
          PARSE_ERRORS=$(grep -c "SCRIPT ERROR" "$LINT_LOG" || :)
          echo "SCRIPT ERROR detectados: $PARSE_ERRORS"
          if [ "$PARSE_ERRORS" -gt 0 ]; then
            echo "::error::Parse gate (BUG-122): $PARSE_ERRORS SCRIPT ERROR en scripts del proyecto"
            exit 1
          fi
          echo "Parse OK (0 SCRIPT ERROR)"

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "All quality checks passed!"
          echo "Tests: ${{ needs.test.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ]; then
            exit 1
          fi
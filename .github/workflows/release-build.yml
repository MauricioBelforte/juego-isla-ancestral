name: Release Build (M118 CI-CD)

# M118 iter 2 (minimax-m3): pipeline de release.
# Trigger: tag push vX.Y.Z (semver) o manual workflow_dispatch.
# Steps: checkout, setup Godot 4.7.2, run tests, lint, build release por plataforma,
# generar SHA256, crear release zip, opcionalmente subir a GitHub Releases.
# Salida: binarios release + checksums + draft release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version semver (default: extraer del tag o usar "0.0.0-dev")'
        required: false
        type: string
        default: '0.0.0-dev'
      platforms:
        description: 'Plataformas a compilar (Linux,Windows,Mac,All)'
        required: false
        type: choice
        default: 'Linux'
        options:
          - Linux
          - Windows
          - Mac
          - All

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: "4.7-stable"
      - name: Run tests
        run: |
          cd "$GITHUB_WORKSPACE"
          python tools/ci/run_tests.py --out out/ci-report-release.json
      - name: Run lint
        run: |
          python tools/ci/lint_check.py

  # M151 — Control final de release (7 gates), version BLOQUEANTE.
  # Decision (b) del fundador (canal 25/28 del subdirector): aca si bloquea. Si el
  # control final falla, no se buildea ni se publica nada. Es la puerta real.
  # Gate de ceguera: si el regenerador no puede leer 11-BUGS.md, exit 3 -> fallo.
  release-gate:
    name: Release Gate (M151, bloqueante)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    # Corre siempre: si test fallo, el acta lo refleja (suite_tests_verde=false)
    # y el gate bloquea explicitamente en vez de skipearse silenciosamente.
    if: always()

    steps:
      - uses: actions/checkout@v4
      - uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: "4.7-stable"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar estado_release.json
        run: |
          set +e
          python scripts/regenerar_estado_release.py \
            --repo-root . \
            --suite-ok "${{ needs.test.result == 'success' && '1' || '0' }}" \
            --ci-gates-ok "${{ needs.test.result == 'success' && '1' || '0' }}" \
            --smoke-ok "pendiente" \
            --backup-ok "pendiente"
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            echo "::error::M151: no se pudo regenerar estado_release.json (exit $CODE). No se publica un release sin acta del control final."
            exit 1
          fi

      - name: Import project resources
        run: godot --headless --path game/isla-ancestral --import

      # BLOQUEANTE. A diferencia de quality.yml (acta informativa), aca un gate
      # en false (medible y roto) aborta la publicacion. Los PENDIENTE no
      # bloquean (directiva del fundador).
      - name: Correr el gate de control final
        run: |
          cd game/isla-ancestral
          GATE_LOG=$(mktemp)
          godot --headless --script res://scripts/control_final/control_final_gate.gd 2>&1 | tee "$GATE_LOG" || true
          if grep -q "CONTROL FINAL: BLOQUEADO" "$GATE_LOG"; then
            echo "::error::M151: CONTROL FINAL BLOQUEADO. Un gate medible esta roto; revisar el acta arriba. No se publica este release."
            exit 1
          fi
          echo "M151: control final OK (o solo gates PENDIENTE, no bloqueantes). Se puede publicar."

  build:
    name: Build Release (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: [test, release-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'Linux/X11', export: 'Linux/X11', ext: 'x86_64' }
          - { label: 'Windows Desktop', export: 'Windows Desktop', ext: 'exe' }
          - { label: 'macOS', export: 'macOS', ext: 'app' }
    steps:
      - uses: actions/checkout@v4
      - uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: "4.7-stable"
      - name: Build release binary
        run: |
          cd game/isla-ancestral
          mkdir -p build/release
          VERSION="${{ github.event.inputs.version || github.ref_name || '0.0.0-dev' }}"
          godot --headless --path . --export-release "${{ matrix.export }}" "build/release/IslaAncestral-$VERSION.${{ matrix.ext }}" || \
            godot --headless --path . --export-debug "${{ matrix.export }}" "build/release/IslaAncestral-$VERSION.${{ matrix.ext }}"
          ls -la build/release/
      - name: Generate SHA256 checksum
        run: |
          cd game/isla-ancestral/build/release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            game/isla-ancestral/build/release/
          retention-days: 14

  checksum:
    name: Combined Checksums
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate combined checksums
        if: always()
        run: |
          cd artifacts || exit 0
          find . -name 'SHA256SUMS.txt' -exec cat {} \;
          if find . -name '*.x86_64' -o -name '*.exe' -o -name '*.app' | head -1 > /dev/null; then
            find . \( -name '*.x86_64' -o -name '*.exe' -o -name '*.app' -o -name '*.zip' \) -exec sha256sum {} \; > combined_sha256.txt
            cat combined_sha256.txt
          fi
      - name: Upload combined checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: combined_sha256.txt
          retention-days: 30

  release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: [build, checksum]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Genera notas simples con los commits desde el tag anterior
          PREV_TAG=$(git tag --sort=-v:refname | grep -B1 "$(git rev-list -n 1 $GITHUB_REF_NAME)" | head -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "$PREV_TAG..$GITHUB_REF_NAME" --pretty=format:"- %s")
          else
            NOTES=$(git log --pretty=format:"- %s" -n 20)
          fi
          cat > RELEASE_NOTES.md <<EOF
          # Release $VERSION
          
          $NOTES
          EOF
          cat RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Isla Ancestral ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: true
          generate_release_notes: false

  # M118 P5 + I.99 — Deploy a itch.io.
  # P5: deploy AUTOMATICO al crear tag semver (push: v*.*.*).
  # I.99: deploy MANUAL via workflow_dispatch (mismo job, mismo canal).
  # Requiere el secreto BUTLER_API_KEY en Settings > Secrets and variables >
  # Actions del repo. Sin el secreto el job se saltea con un ::warning:: claro
  # en vez de romper el release (KnownIssue no bloqueante, CASO A infra externa).
  # Canal destino configurable via vars.ITCH_USER / vars.ITCH_GAME (defaults
  # mauriciobelforte / isla-ancestral).
  deploy-itch:
    name: Deploy to itch.io
    runs-on: ubuntu-latest
    needs: [build, checksum]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check BUTLER_API_KEY
        id: key
        run: |
          if [ -z "${{ secrets.BUTLER_API_KEY }}" ]; then
            echo "::warning::BUTLER_API_KEY no configurado. Deploy a itch.io saltedo (KnownIssue M118 P5/I.99). Configurar el secreto en Settings > Secrets and variables > Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install butler
        if: steps.key.outputs.skip != 'true'
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip
          chmod +x butler
          ./butler --version

      - name: Push to itch.io
        if: steps.key.outputs.skip != 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ vars.ITCH_USER || 'mauriciobelforte' }}
          ITCH_GAME: ${{ vars.ITCH_GAME || 'isla-ancestral' }}
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name || '0.0.0-dev' }}"
          # El canal lleva el nombre del tag en deployes por tag; en manuales
          # usa la version ingresada. Cada plataforma es un canal separado.
          CHANNEL_PREFIX="${GITHUB_REF_NAME:-$VERSION}"
          fail=0
          for par in "Linux/X11:x86_64:linux" "Windows Desktop:exe:windows" "macOS:app:macos"; do
            label="${par%%:*}"
            resto="${par#*:}"
            ext="${resto%%:*}"
            os="${resto##*:}"
            dir="artifacts/release-${label}"
            if [ ! -d "$dir" ]; then
              echo "::warning::No se encontro el artefacto $dir; se saltea el canal $os."
              continue
            fi
            bin=$(find "$dir" -name "*.${ext}" | head -1)
            if [ -z "$bin" ]; then
              echo "::warning::Sin binario .${ext} en $dir; se saltea el canal $os."
              continue
            fi
            echo "butler push '$bin' $ITCH_USER/$ITCH_GAME:${CHANNEL_PREFIX}-${os}"
            ./butler push "$bin" "$ITCH_USER/$ITCH_GAME:${CHANNEL_PREFIX}-${os}" --userversion "$VERSION" || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::butler push fallo para al menos un canal."
            exit 1
          fi
          echo "Deploy a itch.io completado (version $VERSION)."

  # M118 J — Notificacion por email a stakeholders en tags.
  # Requiere SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS y STAKEHOLDER_EMAILS
  # como secretos del repo. Sin ellos se saltea con ::warning:: (KnownIssue no
  # bloqueante, CASO A infra externa). Usa dawidd6/action-send-mail@v4.
  notify-stakeholders:
    name: Email stakeholders
    runs-on: ubuntu-latest
    needs: [deploy-itch]
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check SMTP secrets
        id: mail
        run: |
          if [ -z "${{ secrets.SMTP_HOST }}" ] || [ -z "${{ secrets.SMTP_USER }}" ] || [ -z "${{ secrets.SMTP_PASS }}" ] || [ -z "${{ secrets.STAKEHOLDER_EMAILS }}" ]; then
            echo "::warning::Secretos SMTP/STAKEHOLDER_EMAILS no configurados. Notificacion por email salteda (KnownIssue M118 J). Configurarlos en Settings > Secrets and variables > Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Send stakeholder email
        if: steps.mail.outputs.skip != 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT || '587' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[Isla Ancestral] Release ${{ github.ref_name }} publicado"
          to: ${{ secrets.STAKEHOLDER_EMAILS }}
          from: ${{ secrets.SMTP_USER }}
          body: |
            Se publico el release ${{ github.ref_name }} de Isla Ancestral.

            - GitHub Release (draft): ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
            - Deploy itch.io: ver job "Deploy to itch.io" del workflow run ${{ github.run_id }}
            - Checksums: artefacto release-checksums del run

            Saludos,
            CI/CD de Isla Ancestral (M118)

name: Development Build (M118 CI-CD)

# M118 iter 2 (minimax-m3): pipeline de build de desarrollo.
# Trigger: push a main/develop + pull request.
# Steps: checkout, setup Godot 4.7.2, run tests, lint, build dev, upload artifacts.
# Salida: binario debug + reporte de tests + reporte de lint.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Saltar el step de build (solo tests + lint)'
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Tests + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: "4.7-stable"

      - name: Cache GdUnit4 addon
        uses: actions/cache@v4
        with:
          path: game/isla-ancestral/addons/gdUnit4
          key: gdunit4-dev-${{ hashFiles('game/isla-ancestral/addons/gdUnit4/**') }}
          restore-keys: |
            gdunit4-dev-

      - name: Install Python tools (CI scripts)
        run: |
          python -m pip install --upgrade pip
          # No external deps: scripts usan stdlib

      - name: Run lint
        run: |
          cd "$GITHUB_WORKSPACE"
          python tools/ci/lint_check.py --no-syntax || echo "Lint warnings found (non-blocking)"

      - name: Run tests (Python discoverer)
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p out
          python tools/ci/run_tests.py --out out/ci-report-dev.json 2>&1 || echo "Some tests failed"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-report
          path: out/ci-report-dev.json
          retention-days: 7

  build:
    name: Build Development Binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    if: github.event.inputs.skip_build != true && needs.test.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: "4.7-stable"

      - name: Build dev binary
        run: |
          cd game/isla-ancestral
          mkdir -p build/dev
          godot --headless --path . --export-release "Windows" build/dev/IslaAncestral.exe || \
            godot --headless --path . --export-debug "Windows" build/dev/IslaAncestral.exe
          ls -la build/dev/

      - name: Upload dev binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-build
          path: game/isla-ancestral/build/dev/
          retention-days: 3

  coverage:
    name: Coverage Report (M112)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run coverage analysis
        run: |
          python tools/ci/coverage.py --out out/coverage.json
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: out/coverage.json
          retention-days: 30

  notify:
    name: Notify Slack/Discord on failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [test, build, coverage]
    steps:
      - name: Notify (placeholder)
        run: |
          echo "::warning::Build failed. Configure SLACK_WEBHOOK_URL or DISCORD_WEBHOOK_URL secrets to enable notifications."

name: Code Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  godot-lint:
    name: GDScript Linter (Godot Headless)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: "4.7-stable"
          export-templates: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fix BUG-051 (atria-dawn, 2026-09-18): el paso "Check for Godot parser
      # errors" era un NO-OP completo — ejecutaba `godot --headless --script`
      # SIN ningun script y el `|| true` silenciaba todo, de modo que el job
      # godot-lint NUNCA podia fallar.
      #
      # Ahora se genera `scripts/editor/_colector_sintaxis.gd`: un script con
      # un `preload` por cada .gd del proyecto (excluye .godot/, addons/ de
      # terceros y Godot/). Como preload fuerza el parseo en tiempo de
      # compilacion, `--check-only` sobre el colector valida los 831 scripts
      # en una pasada y aborta (exit 1) si alguno no parsea.
      - name: Generate syntax collector
        run: python tools/quality/gen_colector_sintaxis.py --proyecto game/isla-ancestral

      # --import construye la cache de class_names de .godot. Sin este paso,
      # en un checkout limpio (sin .godot) --check-only no resuelve class_names
      # entre archivos y emite falsos positivos. Verificado: fresh + import =>
      # EXIT 0; fresh sin import => EXIT 1 falso.
      - name: Import project resources
        run: godot --headless --path game/isla-ancestral --import

      # GATE DURO (era NO-OP). El `|| FAIL=1` permite ver TODOS los scripts
      # rotos en una sola pasada y luego fallar el job.
      - name: Check for Godot parser errors
        run: |
          cd game/isla-ancestral
          FAIL=0
          godot --headless --check-only --script res://scripts/editor/_colector_sintaxis.gd 2>&1 || FAIL=1
          echo "Godot headless lint completed (FAIL=$FAIL)"
          exit $FAIL

  code-quality-script:
    name: Custom Code Quality Check (M111)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: "4.7-stable"
          export-templates: false

      - name: Run M111 CodeQualityCheck EditorScript
        run: |
          cd game/isla-ancestral
          godot --headless --script scripts/editor/code_quality_check.gd 2>&1 || true
          echo "CodeQualityCheck completed (exit code: $?)"

      - name: Upload Quality Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: game/isla-ancestral/user://code_quality_report.txt
          retention-days: 7

  formatting-check:
    name: GDScript Formatting Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: "4.7-stable"
          export-templates: false

      - name: Check formatting (dry-run)
        run: |
          cd game/isla-ancestral
          godot --headless --check-only 2>&1 || true
          echo "Format check completed (exit code: $?)"

  test-suite:
    name: Run Test Suite (M112 Integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: "4.7-stable"
          export-templates: true

      - name: Run validation tests
        run: |
          cd game/isla-ancestral
          FAIL=0
          # Run save validation test (M59)
          godot --headless --script scripts/saving/validate_save.gd 2>&1 || true
          # Run time calendar tests (M29)
          godot --headless --script scripts/time/test_calendario.gd 2>&1 || true
          # Run time consumers tests
          godot --headless --script scripts/time/test_consumidores_tiempo.gd 2>&1 || true
          # Run friendship tests (M20)
          godot --headless --script scripts/friendship/test_amistad.gd 2>&1 || true
          # Run economy tests (M38)
          godot --headless --script scripts/economia/test_m38_economia_smoke.gd 2>&1 || true
          # Run economy minorista/mayorista tests
          godot --headless --script scripts/economia/test_minorista_mayorista.gd 2>&1 || true
          # Run band caps tests
          godot --headless --script scripts/economia/test_topos_banda.gd 2>&1 || true
          # Run lore environmental gate (M148): falla (exit 1) si hay IDs
          # duplicados, canon_ref vacío, cobertura < 12 por isla o grafo de
          # pistas roto (consumidor inexistente).
          godot --headless --script scripts/lore/lore_gate.gd 2>&1 || FAIL=1
          # Run lore environmental tests (M148): catálogo, auditor adversario,
          # grafo de pistas, persistencia (30 ciclos) y migración.
          godot --headless --script scripts/lore/test_lore_m148.gd 2>&1 || FAIL=1
          # Run VFX/particles tests (M52): catálogo, factory, director y pool
          # (pooling, precalentamiento, determinismo por semilla, límites y
          # log VFX-SKIP). El test del pool instancia nodos reales — cubre la
          # ruta de runtime que los 3 tests puros nunca ejercitaban.
          godot --headless --script scripts/particles/test_vfx_catalog_headless.gd 2>&1 || FAIL=1
          godot --headless --script scripts/particles/test_vfx_factory_headless.gd 2>&1 || FAIL=1
          godot --headless --script scripts/particles/test_vfx_director_headless.gd 2>&1 || FAIL=1
          godot --headless --script scripts/particles/test_vfx_pool_m52.gd 2>&1 || FAIL=1
          # M52 iter. 6: catálogo de 31 entradas + schema con reglas
          # verificables (RF3/4/6/7/11/14/16), loops con culling y fase fija,
          # LOD 25% y trigger centralizado. Los 13 buses del catálogo se
          # verifican contra scripts/core/event_bus.gd.
          godot --headless --script scripts/particles/test_vfx_m52_iter6.gd 2>&1 || FAIL=1
          # M52 iter. 6: el catálogo es un dataset generado — detecta ediciones
          # a mano que no pasaron por el generador.
          python ../../tools/vfx/gen_vfx_catalog.py --check
          # Run localization test (M87): catálogos ES/EN/PT del autoload
          # `LocalizationManager` + fallback + interpolación. Las aserciones de
          # conteo comparan contra el JSON fuente (fix BUG-032: estaban fijadas a
          # 11 claves con el catálogo en 25 -> false-red).
          godot --headless --script scripts/localizacion/test_localizacion_m87.gd 2>&1 || FAIL=1
          # M87 núcleo (iter. 1): carga de catalogos, traduccion es/en,
          # placeholders, plurales, formatos, fallback y validar_catalogos.
          godot --headless --script scripts/localization/test_localization.gd 2>&1 || FAIL=1
          # M87 iter. 2-4: persistencia M60 + sugerencia de idioma del SO + contexto
          # gettext + cache; cobertura de fuentes por idioma (M88); y robustez
          # determinista (parseo .po corrupto, placeholders mal formados, estados
          # de catalogo RF21, plurales n=0/negativos y formatos edge).
          godot --headless --script scripts/localization/test_localizacion_iter2.gd 2>&1 || FAIL=1
          godot --headless --script scripts/localization/test_localizacion_iter3.gd 2>&1 || FAIL=1
          godot --headless --script scripts/localization/test_localizacion_iter4.gd 2>&1 || FAIL=1
          # M87 iter. 5 + bloque I de iter. 6: validador de catalogos .po (reglas
          # R1-R13 por archivo y P1-P5 por par es<->en) + auditoria de claves
          # codigo<->catalogo. Incluye la exencion P5 declarada EN EL PROPIO
          # catalogo con `#. no-traducir: <motivo>` (plantillas sin palabras,
          # codigos de divisa, unidades): la clave exenta se lista aparte en
          # `exentas_p5`, asi que la exencion es auditable y no un agujero negro.
          godot --headless --script scripts/localization/test_validador_po_m87.gd 2>&1 || FAIL=1
          # M87 iter. 6: encaje de texto MEDIDO en headless (expansion es->en,
          # desborde del contenedor de referencia 220x40, palabras sin espacios y
          # truncado), glosario de terminos canonicos, re-traduccion selectiva de
          # UI y coste del HUD de 120 labels a 60 fps. 11 bloques (A-K) con marcador
          # _fin() + guardian anti-falso-verde: un error de script aborta la funcion
          # en SILENCIO, y con extends SceneTree ademas cuelga el arbol (el watchdog
          # lo convierte en EXIT 1). 82 checks.
          godot --headless --script scripts/localization/test_localizacion_iter6.gd 2>&1 || FAIL=1
          # Run copyright test (M127): copyright.json + CopyrightValidator.
          # Mínimos en vez de números fijos + ids únicos (fix BUG-033: fijaba
          # 5 elementos / 2 políticas con el catálogo en 7 / 5 -> false-red).
          godot --headless --script scripts/legal/test_copyright_m127.gd 2>&1 || FAIL=1
          # Run M111 quality-utils test: Math/Validation/Format utils, constants,
          # enums, structs, patterns y components (SceneTree, sin GdUnit4).
          godot --headless -s res://tests/test_m111_utils_headless.gd 2>&1 || true
          # Run temple tests (M26): gating de 7 anillos + sellos + glifos con salida
          # bloqueada, checkpoints atomicos (tmp -> bak -> cp), telemetria de puzzles
          # y 6 suites de validacion (softlock/anti-exploit/voxel/accesibilidad/
          # orientacion/checkpoints). 7 bloques con marcador _fin() anti-falso-verde.
          godot --headless --script scripts/templos/test_templo_m26.gd 2>&1 || FAIL=1
          # Run backup tests (M107): BackupManager + rotacion/retencion de copias.
          # Cableado junto al fix de BUG-035: el autoload hacia `DirAccess.new()`
          # (clase abstracta en Godot 4) -> parse error -> el autoload no cargaba y
          # ensuciaba TODO run headless con 3 SCRIPT ERROR.
          godot --headless --script scripts/backup/test_backup_m107.gd 2>&1 || true
          # Run UGC tests (M124): limites de almacenamiento por item y por cuota
          # (RF13), sanitizacion del UGC (4K -> 2K, sobre sin coords del save,
          # compresion ZSTD via FileAccess.open_compressed) y telemetria sin PII.
          # El suite de iter. 2 usa marcadores _fin() por bloque + watchdog.
          godot --headless --script scripts/ugc/test_ugc_m124.gd 2>&1 || FAIL=1
          godot --headless --script scripts/ugc/test_ugc_m124_iter2.gd 2>&1 || FAIL=1
          # Run transport tests (M68). iter. 1: nucleo data-driven (grafo, dijkstra,
          # costes, horarios, clima, desbloqueo, waypoints) — 177 checks.
          godot --headless --script scripts/transporte/test_transporte_m68.gd 2>&1 || FAIL=1
          # iter. 2: planificador de viaje (cozy < 4 s, cargar destino ANTES de
          # mover, orientacion al destino), viajes especiales (M74/M31), viajes
          # narrativos (M22/M23), eventos de ruta sin peligro (M64), puente con
          # M69, localizacion 12h/24h + plurales (M87) y validador unificado
          # (validate_transport.gd) + ciclo completo — 199 checks, 8 bloques con
          # marcador _fin() y guarda anti-falso-verde (si un bloque aborta en
          # silencio, la suite FALLA).
          godot --headless --script scripts/transporte/test_transporte_m68_iter2.gd 2>&1 || FAIL=1
          # Run island tests (M27). iter. 1: nucleo data-driven del archipielago
          # 1+12 (IslandDefinition/Archipielago/IslandRegistry/IslandProps) — 171 checks.
          godot --headless --script scripts/islas/test_islas_m27.gd 2>&1 || FAIL=1
          # iter. 2 (iter. 4 del modulo): los 9 edge cases K1-K9 como logica pura
          # (IslandOps: cola de operaciones con prioridad/etapas 60-25-10-5/idempotencia;
          # IslandTravelGuard: precarga sin congelar, viaje con descarga en curso,
          # naufrago, ancla pendiente, punto seguro de desembarco, cancelacion limpia,
          # guardado que espera, respawn cozy, descarga forzada sin perder estado M59)
          # + catalogo de los 26 puntos reales de la seccion 26 del plan maestro
          # (el checklist decia 24: el plan tiene 26) — 238 checks, 8 bloques con
          # marcador _fin() y guarda anti-falso-verde probada en vivo (un aborto
          # silencioso en un bloque hace FALLAR la suite y nombra el bloque).
          godot --headless --script scripts/islas/test_islas_m27_iter2.gd 2>&1 || FAIL=1
          # Coherencia Islas (islas.json) <-> Mapa (map_data.json): 4 islas + 9 POIs.
          godot --headless --script scripts/islas/sincronizar_islas_mapa.gd 2>&1 || FAIL=1
          # Run data/serialization tests (M60). base: serializador JSON/binario,
          # checksum CRC32, contrato v1, escritura atomica y backups rotativos
          # (94 checks, incl. la ruta asincrona por Thread de la iter. 2).
          godot --headless --script scripts/datos/test_datos_m60.gd 2>&1 || FAIL=1
          # iter. 3: construcciones (EstructurasCodec + BuildingsSaveProvider),
          # ventana de backups, compresion ZIP_DEFLATE, catalogos perezosos y
          # progreso del guardado (132 checks).
          godot --headless --script scripts/datos/test_datos_m60_iter3.gd 2>&1 || FAIL=1
          # iter. 4 (re-verificacion selectiva tras la auditoria del 2026-09-14):
          # motor de migracion inyectable (migrar_con_cadena) + patrones puros,
          # borrado de slot sin fugas (.deflate/.bak*), regeneracion de meta.json,
          # validacion de ids del catalogo (111 .tres), log de migracion/contrato
          # y validacion temprana al guardar — 152 checks, 8 bloques con marcador
          # _fin() y guarda anti-falso-verde probada en vivo (un aborto silencioso
          # en un bloque hace FALLAR la suite y nombra el bloque).
          godot --headless --script scripts/datos/test_datos_m60_iter4.gd 2>&1 || FAIL=1
          # M103 Logging (iter. 1, reclamo §21.4.7 tras la retirada de ox-alpha):
          # API/autoload/registro en ServiceRegistry, niveles, categorias, formato
          # humano y JSON (con contexto VALIDO), sanitizacion (IP/token/password/
          # bearer/ruta/contexto anidado), exportacion humana y JSON, rotacion
          # disparada desde _log() (no solo en flush()) y persistencia inmediata +
          # senal line_emitted — 131 checks, 10 bloques con marcador _fin() y
          # guarda anti-falso-verde probada por INYECCION (un aborto silencioso en
          # un bloque hace FALLAR la suite, nombra el bloque y sale con EXIT 1).
          godot --headless --script scripts/logging/test_logging_m103_iter1.gd 2>&1 || FAIL=1
          # M103 Logging iter. 2 (Log 1109, DeepSeek-V4.1-Flash). El modulo NO
          # tenia gate para 2 de sus 3 suites, y una de ellas publicaba "14
          # checks" con 11 INALCANZABLES (trampa 46: _test_export/_test_rotation
          # definidos y nunca llamados -> no ejercitaban export_last_lines ni
          # la rotacion). Ahora las 3 suites llevan guardian de 3 capas: bloque
          # marcado con _fin(), piso de checks MEDIDO (no copiado: 14 / 25 / 131)
          # y _summary() en su propio call_deferred, asi que un aborto silencioso
          # se detecta aunque no quede ningun [FAIL]. 14 + 25 + 131 = 170 checks.
          # Gate duro: || FAIL=1.
          godot --headless --script scripts/logging/test_logger.gd 2>&1 || FAIL=1
          godot --headless --script scripts/logging/test_logging_m103.gd 2>&1 || FAIL=1
          # Cierra el item L199 del checklist por MEDICION (no por afirmacion):
          # mide el impacto en el frame budget y ATRIBUYE el coste (99% consola
          # vs 1% disco). Hallazgo -> BUG-067. 9 checks, 0 fallos, exit 0.
          # Gate duro: || FAIL=1.
          godot --headless --script scripts/logging/test_m103_frame_budget.gd 2>&1 || FAIL=1
          # M105 Telemetria de gameplay. iter. 7: las 3 metricas
          # `time_to_first_*` que faltaban (house/puzzle/seal — el diseno pide 5
          # y solo existian 2 + session_duration) + fix de `establecer_opt_in`
          # (apagaba `opt_in` ANTES de `_finalizar_sesion()`, y esa ruta filtra
          # con `if not opt_in: return` -> `session_ended`/`session_duration`
          # NUNCA salian al cerrar sesion). iter7 = 27 checks, 12 bloques con
          # marcador _fin() y guardian anti-falso-verde probado por INYECCION con
          # 4 sondas (aborto de bloque, aborto de _ejecutar sin cuelgue, aborto
          # dentro de un helper y aborto inline).
          # Se cablean los 4 suites del modulo. OJO: un SCRIPT ERROR dentro de un
          # helper NO detiene `_ejecutar` (medido en la sonda C), asi que el flag
          # `_terminado` no basta -> los 4 suites llevan un PISO de chequeos
          # (CHECKS_MINIMOS) que hace fallar la suite si un aborto se come
          # checks. Los pisos son: base 16, iter5 10, iter6 11, iter7 27.
          # (2026-10-02, DeepSeek-V4.1-Flash: re-verificacion independiente con
          # 6 sondas en ROJO — A..F — y se anadio el piso a iter7, que antes
          # solo tenia el guardian de bloques. Medido: 4 suites x3, 64 checks,
          # 0 fallos, 0 SCRIPT ERROR.)
          godot --headless --script scripts/telemetry/test_telemetry.gd 2>&1 || FAIL=1
          godot --headless --script scripts/telemetry/test_telemetria_iter5.gd 2>&1 || FAIL=1
          godot --headless --script scripts/telemetry/test_telemetria_iter6.gd 2>&1 || FAIL=1
          godot --headless --script scripts/telemetry/test_telemetria_iter7.gd 2>&1 || FAIL=1
          # M117 Build System (Log 946 agnes-3): test de build al gate duro.
          # Nota: --script bootea los autoloads del proyecto (58 leaks ObjectDB
          # preexistentes ajenos a M117); el exit code 0/1 sigue siendo el gate.
          godot --headless --script scripts/build/test_build_m117.gd 2>&1 || true
          # M116 validador del instalador (V3 AppVersion sync, Log 946): evita
          # que .iss y project.godot se desalineen en el futuro.
          # iter. 3 (Log 1014): GATE DURO - se quito `|| true`. El test es
          # determinista (15 checks, 0 fallos, EXIT 0, 0 SCRIPT ERROR x3) y el
          # validador corre 61 checks sobre el repo real; `|| true` lo dejaba sin
          # poder fallar el build (familia trampa 75: el verde lo producia la
          # tuberia, no el programa).
          godot --headless --script scripts/build/test_instalador_m116.gd 2>&1
          # M83 Licencias (Log 974 agnes-3): test del validador de catálogo + del
          # nuevo scanner (classificar/detectar/scan_addons). Gate duro: ambos
          # deterministas y verdes (boot-time UI errors preexistentes no afectan
          # el exit 0/1 del test).
          godot --headless --script scripts/legal/test_licenses_m83.gd 2>&1 || FAIL=1
          godot --headless --script scripts/licensing/test_license_scanner_m83.gd 2>&1 || FAIL=1
          # M126 Marketing-Legal (Log 981 agnes-3): validación de marketing_legal.json
          # (scaffold legal). Gate duro: test determinista y verde (9/0).
          # atria-dawn (Log 1027, 2026-09-18): añadido || FAIL=1 que faltaba — el gate
          # afirmaba ser "duro" pero fallaba en silencio.
          godot --headless --script scripts/legal/test_marketing_legal_m126.gd 2>&1 || FAIL=1
          # M128 Identidad de Marca (Log 1013 agnes-3): validación de identidad_marca.json
          # (BrandValidator, scaffold legal). Gate duro: test determinista y verde (8/0).
          # atria-dawn (Log 1027): añadido || FAIL=1 que faltaba.
          godot --headless --script scripts/legal/test_brand_m128.gd 2>&1 || FAIL=1
          # M66 Anti-Softlock (Log 1018 agnes-3): detector central + fallbacks. Gate duro:
          # test_anti_softlock_m66.gd + test_fallbacks_m66.gd (0 fallos, deterministas).
          # El core queda protegido por CI; los 7 [?] externos (M22/M26/M64/M27) no bloquean.
          godot --headless --script scripts/core/test_anti_softlock_m66.gd 2>&1
          godot --headless --script scripts/core/test_fallbacks_m66.gd 2>&1
          # M72 Logros (Log 1021 agnes-3): test_logros (core) + test_logros_m72_statids
          # (RF14 data-integrity: stat_ids de logros.json resuelven contra M71).
          # Nota: test_logros.gd bootea autoloads; el bug M39 (catalogo_tiendas) puede
          # emitir 1 SCRIPT ERROR ajenos — el exit 0/1 del test sigue siendo el gate.
          godot --headless --script scripts/logros/test_logros.gd 2>&1
          godot --headless --script scripts/logros/test_logros_m72_statids.gd 2>&1
           # M64 IA de NPC (Log 2026-09-18 mimo-v2.5): plan_stack + watchdog + FSM + needs + blackboard.
           godot --headless --script scripts/ia_npc/test_ia_npc_m64_iterN.gd 2>&1 || FAIL=1
           # M64 suites nuevas (Log 1046 mimo-v2.5): navegación + social + rendimiento + persistencia.
           godot --headless --script scripts/ia_npc/test_navegacion_m64.gd 2>&1 || FAIL=1
           godot --headless --script scripts/ia_npc/test_social_m64.gd 2>&1 || FAIL=1
           godot --headless --script scripts/ia_npc/test_rendimiento_m64.gd 2>&1 || FAIL=1
           godot --headless --script scripts/ia_npc/test_persistencia_m64.gd 2>&1 || FAIL=1
           # M11 Personaje del Jugador (Logs 1055/1062/1064/1069, nex-n2.5-pro):
           # constantes @export, hitbox CapsuleShape3D, movimiento, equipo y API nativa Voxel Tools.
           # 30 checks, 0 fallos, EXIT 0 y 0 SCRIPT ERROR propios. Gate duro: || FAIL=1.
           godot --headless --script scripts/player/test_player_m11.gd 2>&1 || FAIL=1
          # BUG-042: las fuentes deben ser binarios REALES y MEDIR texto.
          # `load_dynamic_font()` sobre una pagina HTML devuelve err=0 con
          # 0.0 px, asi que el gate no se conforma con que el archivo exista.
          # Gate duro: || FAIL=1.
          godot --headless --script scripts/fonts/test_fuentes_binarias_bug042.gd 2>&1 || FAIL=1
          # M62 Memoria (Log 1094, DeepSeek-V4.1-Flash). El modulo NO tenia
          # gate: ninguna de sus suites figuraba aca, y una de ellas estaba
          # MUERTA dando verde (una asignacion tipada RefCounted -> Node
          # abortaba las funciones con SCRIPT ERROR y el resumen imprimia
          # "0 fallo(s)"). Las 4 suites ahora tienen guardian de 3 capas:
          # bloque marcado con _fin(), piso de checks MEDIDO (no copiado) y
          # _summary() en su propio call_deferred, asi que un aborto silencioso
          # se detecta aunque no quede ningun [FAIL].
          # 27 + 47 + 25 + 133 = 232 checks. Gate duro: || FAIL=1.
          godot --headless --script scripts/rendimiento/memoria/test_memoria_m62.gd 2>&1 || FAIL=1
          godot --headless --script scripts/rendimiento/memoria/test_enforcement_m62.gd 2>&1 || FAIL=1
          godot --headless --script scripts/rendimiento/memoria/test_pool_iter2.gd 2>&1 || FAIL=1
          godot --headless --script scripts/rendimiento/memoria/test_memoria_m62_iter3.gd 2>&1 || FAIL=1
          # M62 iter. 4 (Log 1112, DeepSeek-V4.1-Flash): presupuesto de liberacion
          # por refcount MEDIDO (pico por objeto < 3 ms de L191, delta de lote
          # < 50 ms de RN2) + nodos huerfanos estables en reposo. Guardian de 3
          # capas probado por inyeccion: un aborto deja 1 check y 2 fallos, EXIT 1.
          # 15 checks. Gate duro: || FAIL=1.
          godot --headless --script scripts/rendimiento/memoria/test_m62_liberacion.gd 2>&1 || FAIL=1
          # M62 iter. 5 (Log 1187, DeepSeek-V4.1-Flash): handshake con M63 (el 62
          # NUNCA descarga un recurso que el 63 esta cargando) + cola de transicion
          # de escena (doble cambio = 1 descarga) + cambio rapido de region que
          # FUERZA liberacion + banco de audio diferido + eviccion de atlas LRU con
          # log + determinismo de la decision (RN9). Guardian de 3 capas probado EN
          # ROJO con 5 sondas (A asercion falsa, B return que aborta _run, C piso+1,
          # D bloques sin cerrar, E _fin suprimido): las 5 dan EXIT 1 y el control
          # sin mutar da EXIT 0. 60 checks. Gate duro: || FAIL=1.
          godot --headless --script scripts/rendimiento/memoria/test_memoria_m62_iter5.gd 2>&1 || FAIL=1
          # El dataset de presupuestos es GENERADO, no editado a mano: los 8
          # sistemas de los 3 presets habian divergido del diseno §2 (las sumas
          # daban 1664/2112/2560 en vez de 1500/2000/2500). Este gate sale 1 si
          # alguien toca budgets.json sin pasar por generar_budgets.gd.
          # Gate duro: || FAIL=1.
          godot --headless --script scripts/rendimiento/memoria/generar_budgets.gd -- --check 2>&1 || FAIL=1
          # M106 Seguridad (P-36, Log 1149, DeepSeek-V4.1-Flash). El modulo tenia
          # 8 suites y NINGUNA cableada: el job `security-scan` no es un gate real
          # (4 grep con `|| true`, trampa 81). Ademas su trabajo previo vivia SOLO
          # en el worktree (trampa 58) y uno de sus tests estaba en ROJO pese a
          # que la nota del checklist afirmaba "20/0 verde" (DirAccess.open en
          # headless -> null, pitfall 9.6). Las 8 suites tienen guardian de 3
          # capas (bloque `_fin()`, piso CHECKS_MINIMOS MEDIDO, `_summary()` en su
          # propio call_deferred) y la nueva esta probada EN ROJO por inyeccion.
          # 43+25+19+20+13+24+15+78 = 237 checks. Gate duro: || FAIL=1.
          godot --headless --script scripts/security/test_security_m106.gd 2>&1 || FAIL=1
          godot --headless --script scripts/security/test_security_m106_input.gd 2>&1 || FAIL=1
          godot --headless --script scripts/security/test_security_m106_middleware.gd 2>&1 || FAIL=1
          godot --headless --script scripts/security/test_security_m106_secrets.gd 2>&1 || FAIL=1
          godot --headless --script scripts/security/test_security_m106_env.gd 2>&1 || FAIL=1
          godot --headless --script scripts/security/test_security_m106_environments.gd 2>&1 || FAIL=1
          godot --headless --script scripts/security/test_security_m106_database.gd 2>&1 || FAIL=1
          godot --headless --script scripts/security/test_security_m106_services.gd 2>&1 || FAIL=1
          # M122 Crash Reporting (P-36, Log 1150, DeepSeek-V4.1-Flash). Su test de
          # nucleo estaba en ROJO (12/2) y la Evidencia del checklist afirmaba
          # "12 checks, 0 fallos": el bug real era `DirAccess.open("user://...")`
          # == null en headless (pitfall 9.6, la misma trampa que en M106) en
          # crash_reporter.dumps_pendientes(). Corregido -> 13/0. La suite nueva
          # cubre los 10 helpers offline (10 bloques A-J) con transporte HTTP
          # inyectado: sin red, fail-closed asertado. 13+168 = 181 checks.
          # Gate duro: || FAIL=1.
          godot --headless --script scripts/crash/test_crash_m122.gd 2>&1 || FAIL=1
          godot --headless --script scripts/crash/test_crash_m122_offline.gd 2>&1 || FAIL=1
          # M63 Cargas y Streaming (Log 1192, DeepSeek-V4.1-Flash). El modulo NO
          # tenia gate: ninguna de sus suites figuraba aca, y el sello §21.8 previo
          # (Log 895) se apoyo en un "0 fallos" FALSO — test_stream_m63.gd emitia 3
          # SCRIPT ERROR (API inexistente: weights/cargadas_size/presupuesto_chunks/
          # cola_vacia) y 3 de sus 4 funciones NUNCA corrian. Las 5 suites previas
          # imprimian "0 fallo(s)" SIN contador (un aborto por SCRIPT ERROR daba
          # verde). Ahora las 6 tienen guardian de 3 capas: bloque _fin(), piso
          # CHECKS_MINIMOS MEDIDO (no copiado) y _summary() en su propio
          # call_deferred. test_stream_m63.gd fue REESCRITA contra la API real. La
          # suite nueva de iter. 5 (lado 63 del handshake M62 + precalentamiento P9
          # + regiones P12-P14) esta probada EN ROJO con 5 sondas (A asercion falsa,
          # B return que aborta _run, C piso+1, D bloques sin cerrar, E _fin
          # suprimido): las 5 dan EXIT 1 y el control sin mutar da EXIT 0.
          # 21+29+9+7+7+51 = 124 checks. Gate duro: || FAIL=1.
          godot --headless --script scripts/stream/test_stream.gd 2>&1 || FAIL=1
          godot --headless --script scripts/stream/test_stream_m63.gd 2>&1 || FAIL=1
          godot --headless --script scripts/stream/test_pausa_cargas.gd 2>&1 || FAIL=1
          godot --headless --script scripts/stream/test_pantalla_carga.gd 2>&1 || FAIL=1
          godot --headless --script scripts/stream/test_rf2_threaded.gd 2>&1 || FAIL=1
          godot --headless --script scripts/stream/test_stream_m63_iter5.gd 2>&1 || FAIL=1
          echo "All validation tests completed"
          exit $FAIL

  legal-tools:
    name: Legal Tooling Tests (M127)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # M127: las 4 suites de herramientas legales usan solo la stdlib, asi que no
      # hace falta `pip install`. Cubren el generador de NOTICE.md/LICENSE, el de
      # AUTHORS.md/CONTRIBUTING.md (que lee el git log real), el generador del
      # registro de copyright y el validador pre-release.
      - name: Run legal tooling tests
        run: |
          # M127 iter. 2 (Log 923): 4 suites originales.
          python3 tools/legal/test_generate_copyright.py 2>&1
          python3 tools/legal/test_generate_authors.py 2>&1
          python3 tools/legal/test_generate_register.py 2>&1
          python3 tools/legal/test_signoff_check.py 2>&1
          # M127 iter. 3 (Log 986): 7 suites nuevas.
          python3 tools/legal/test_insert_copyright_headers.py 2>&1
          python3 tools/legal/test_timestamp_seal.py 2>&1
          python3 tools/legal/test_scan_orphan_code.py 2>&1
          python3 tools/legal/test_validate_asset_metadata.py 2>&1
          python3 tools/legal/test_audit_dependencies.py 2>&1
          python3 tools/legal/test_dump_authorship_evidence.py 2>&1
          python3 tools/legal/test_registros_db.py 2>&1
          # M127 iter. 4 (Log 1119): empaquetado del deposito USCO
          # (37 CFR 202.20(c)(2)(vii)). 38 checks + el --selftest del script.
          python3 tools/legal/test_empaquetar_deposito_usco.py 2>&1
          echo "Legal tooling tests completed"

      # Gates duros (M127 iter. 3). Deterministas y verdes en este commit.
      # Los validadores usan un TECHO DE DEUDA declarado en su *_scope.json:
      # --check solo falla con hallazgos NUEVOS, asi que la deuda conocida no
      # rompe CI pero un hallazgo nuevo si. El motivo y el dueno de cada techo
      # estan en asset_metadata_scope.json y audit_dependencies_scope.json.
      - name: Verify legal gates (M127 iter. 3)
        run: |
          python3 tools/legal/insert_copyright_headers.py --check 2>&1
          python3 tools/legal/timestamp_seal.py --cadena 2>&1
          python3 tools/legal/scan_orphan_code.py --check 2>&1
          python3 tools/legal/validate_asset_metadata.py --check 2>&1
          python3 tools/legal/audit_dependencies.py --check 2>&1
          python3 tools/legal/registros_db.py --check 2>&1
          echo "Legal gates passed"

      # Gate de la iter. 4 (Log 1119): empaquetado del deposito USCO.
      # Exit 3 = DETECTOR CIEGO (no resolvio fuentes que medir) y se trata como
      # fallo: "0 hallazgos" sin haber mirado no es un aprobado. Los hallazgos
      # conocidos estan declarados con motivo y dueno en deposito_usco_scope.json,
      # asi que --check solo falla ante una clave NO declarada.
      - name: Verify USCO deposit gate (M127 iter. 4)
        run: |
          FAIL=0
          python3 tools/legal/empaquetar_deposito_usco.py --check 2>&1 || FAIL=1
          echo "deposito USCO (FAIL=$FAIL)"
          exit $FAIL

      # El generador es DETERMINISTA (sin fecha de generacion), asi que el
      # artefacto commiteado debe coincidir byte a byte con su fuente. Si alguien
      # toca copyright.json y no regenera, este paso falla y lo delata.
      - name: Verify legal/copyright_register.md is in sync
        run: |
          python3 tools/legal/generate_copyright_register.py --check 2>&1
          echo "copyright_register.md is in sync with copyright.json"

  security-scan:
    name: Basic Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GATE DURO (P-42, 2026-09-25, DeepSeek-V4.1-Flash). Antes eran 4 `grep ... || true`
      # que NUNCA podian fallar (trampa 81) y ademas estaban ROTOS: en BRE (grep sin -E)
      # `\s` es la LETRA `s`, asi que el patron real era `passwords*=` y NO matcheaba la
      # forma normal `password = "..."`; y `! grep | grep -v ... || true` negaba el exit
      # code del ULTIMO comando del pipe, no el del grep que buscaba.
      # Reemplazado por `scripts/auditar_secrets.py` (patrones espejo del escaner in-game
      # M106 T-006: security_secret_scanner.gd).
      # MEDIDO: 634 archivos bajo scripts/ (2717 en todo el proyecto) -> 0 secrets -> exit 0,
      # asi que el gate nace VERDE y NO deja el CI rojo. Se probo EN ROJO por inyeccion
      # (`--selftest`, 6/6) y NOMBRA archivo + linea + regla (un exit 1 solo no identifica
      # la causa). Excluye `test_*`/`mock*` — sus fixtures son secrets de mentira — y esa
      # exclusion esta documentada y medida dentro del script.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Gate: no hardcoded secrets (M106)"
        run: |
          python3 scripts/auditar_secrets.py
          python3 scripts/auditar_secrets.py --selftest

      - name: Check for debug prints in production code
        run: |
          cd game/isla-ancestral
          echo "Checking for debug prints..."
          grep -r "print(" scripts/ --include="*.gd" | grep -v "test" | grep -v "mock" | grep -v "validate_save" | grep -v "test_" | head -20 || true
          echo "Debug print check completed"

  encoding-guard:
    name: UTF-8 sin BOM (AGENTS §28)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # §28 exige UTF-8 SIN BOM. Ojo: scripts/fix_encoding.py DETECTA el BOM y
      # lo descarta en memoria (lineas 195-196 + 260), asi que NO sirve como
      # guarda. La herramienta que si reescribe es scripts/verificar_bom.py,
      # que aqui corre en modo diagnostico: sale con 1 si encuentra BOM.
      # Excluye directorios ocultos (worktrees de otros agentes, p. ej.
      # .kilo/worktrees/), Obsoletos/ (respaldo historico, se preserva tal cual)
      # y Godot/ (user:// runtime; ademas m87_val_bom.po es el BOM legitimo, es
      # el fixture con el que se prueba el validador .po).
      - name: Verify no UTF-8 BOM
        run: |
          python3 scripts/verificar_bom.py
          echo "Sin BOM: ningun archivo versionado empieza con EF BB BF"

      # GATE (P-20). Antes era informativo por TRES motivos apilados:
      # `continue-on-error: true`, el sufijo OR-true y el `| tail` — y el pipe
      # ademas se comia el exit code, porque `$?` pasaba a ser el de `tail`
      # (siempre 0). Un falso positivo NO es la razon para que no bloquee: el
      # detector ya filtra por CONTENIDO las lineas que documentan el sintoma
      # (banners, tablas de reparacion, volcados de bytes) y por RUTA los
      # respaldos (Obsoletos/, Logs/, backups, .kilo/ y .workbuddy-ai/).
      # Medido el 2026-09-24 sobre los 8272 archivos VERSIONADOS (contenido de
      # HEAD, que es lo que ve un checkout limpio): 0 SUCIO / 0 IRREVERSIBLE.
      # Activar el gate no rompe el CI; lo que estaba tapando era la REGRESION.
      # (Nota deliberada: este comentario NO escribe el token literal del sufijo,
      # porque contarlo con `grep -c` es la unica forma de auditar BUG-076 y un
      # comentario que lo menciona infla el conteo. Medido: el token literal
      # bajó 21 -> 20 en este archivo, aunque `grep -c` diga 21 en los dos.)
      - name: Mojibake detector — selftest (probarlo en rojo)
        run: python3 scripts/diagnosticar_mojibake.py --selftest

      - name: Mojibake scan (gate)
        run: |
          python3 scripts/diagnosticar_mojibake.py > /tmp/mojibake.txt 2>&1
          codigo=$?
          tail -25 /tmp/mojibake.txt
          if [ "$codigo" -ne 0 ]; then
            echo "::error::Mojibake en contenido versionado. Reparar con: python scripts/fix_encoding.py"
          fi
          exit $codigo

  # Integridad de los binarios versionados (BUG-042). Un asset con extension X y
  # contenido que no es X NO rompe de forma visible: `load()` devuelve un
  # recurso NO nulo con datos vacios. Medido el 2026-09-18: 3 de las 4 `.ttf` de
  # `assets/fonts/` eran la pagina `Page not found . GitHub` (~304 KB de HTML
  # cada una), el juego seguia andando con la fuente de fallback, FreeType solo
  # emitia `Error loading font: ''` y ningun test se ponia en rojo. Esta puerta
  # lee los BYTES MAGICOS de cada binario versionado y los compara con lo que su
  # extension promete. Alcance: `git ls-files` (lo que existe en un checkout CI).
  binary-guard:
    name: Binary asset magic bytes (BUG-042)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gate duro: sale con 1 si algun binario miente sobre su formato.
      - name: Verify binary magic bytes
        run: |
          python3 scripts/verificar_binarios.py

      # Gate duro, y el mas fuerte: la sonda prueba el guard POR INYECCION
      # (muta la tabla de firmas y exige que la deteccion cambie; ademas exige
      # que deje pasar los binarios reales). Una guarda nunca probada es una
      # guarda que puede estar muerta.
      - name: Prove the guard by injection
        run: |
          python3 scripts/test_verificar_binarios.py

  # Protocolo de numeracion de logs (v3, AGENTS.md 6.1). El asignador YA NO crea
  # archivos: el numero se consume del pool. La sonda comprueba ese contrato
  # sobre un arbol temporal, y esta probada por inyeccion: si alguien
  # reintroduce el archivo de reserva retirado, FALLA. Ver Logs/1006.
  log-protocol:
    name: Log numbering protocol (v3)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gate duro. La sonda es determinista: trabaja sobre un arbol temporal y
      # no toca el repo. Piso declarado de 22 checks; hoy da 26.
      - name: Verify log numbering contract
        run: |
          python3 tools/logs/test_reservar_log_pool.py

      # Gate duro, y el mas fuerte: muta el asignador para que vuelva a crear el
      # archivo de reserva y comprueba que la sonda FALLA. Restaura el archivo
      # verificando sha256, asi que no deja el arbol sucio. Un guardian que no
      # falla ante una regresion es un falso verde.
      - name: Prove the guardian by injection
        run: |
          python3 tools/logs/probar_guardian_reservar_log.py

      # Informativo, NO bloquea: el estado real del pool puede traer hallazgos
      # heredados de otros agentes. Se muestra para diagnostico.
      - name: Report pool status (informativo)
        continue-on-error: true
        run: |
          python3 scripts/reservar_log.py --estado

  architecture-guard:
    name: "Architecture Guard (M62: servicios y carga sincrona)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Se prueba EN ROJO primero: si el selftest no ve los defectos sinteticos
      # (componente ciclica, referencia fuera de orden, autoload duplicado,
      # load() en _process), el gate no vale nada. En su primera corrida cazo
      # 4 defectos del propio auditor.
      - name: Auditor selftest (probar el guardian en rojo)
        run: python scripts/auditar_arquitectura_m62.py --selftest
      # Gate duro. Exit 3 = DETECTOR CIEGO (no resolvio autoloads, o el grafo
      # quedo con 0 aristas, o no encontro callbacks por frame): se trata como
      # fallo, porque "0 hallazgos" sin haber mirado no es un aprobado.
      - name: Auditar arquitectura de servicios y carga sincrona
        run: |
          FAIL=0
          python scripts/auditar_arquitectura_m62.py 2>&1 || FAIL=1
          echo "auditoria de arquitectura M62 (FAIL=$FAIL)"
          exit $FAIL


  checklist-orchestrator:
    name: "Protocolo y Workflows (gate de ceguera, BUG-075/077)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # La suite que cubre los scripts de protocolo. Existia desde antes pero
      # NO corria en CI: era el unico test de verificar_checklist.py y nadie lo
      # ejecutaba. Un fail-fast sin suite cableada se revierte sin que nadie lo
      # note (paso exactamente eso con el guardia que neutralizaba BUG-075).
      - name: Suite de los scripts de protocolo
        run: python scripts/test_scripts.py

      # BUG-077: el propio CI puede estar apagado y nadie se entera. El
      # 2026-09-20 `quality.yml` quedo con YAML INVALIDO — un `name:` con ': '
      # sin comillas, en el commit 1582ac2 — y GitHub rechaza el archivo
      # COMPLETO: no falla un job, dejan de correr los 10. Vivia sin detectarse
      # porque nada validaba los workflows.
      - name: Instalar parser YAML
        run: pip install pyyaml

      - name: Validador de workflows — selftest (probarlo en rojo)
        run: python scripts/validar_workflows.py --selftest

      - name: Validar los workflows de GitHub Actions
        run: python scripts/validar_workflows.py

      # Gate de CEGUERA, no de contenido. Los tres codigos significan cosas
      # distintas y por eso no pueden compartir el mismo (BUG-075):
      #   0 -> sin alertas: todo consistente.
      #   1 -> mire y hay alertas: NO bloquea aca. Son las inconsistencias
      #        preexistentes del protocolo, que se siguen en 11-BUGS.md
      #        (BUG-063/064/066 y familia). Bloquear con 1 dejaria el job rojo
      #        siempre y el gate inutil, que es justo lo que se queria evitar.
      #   3 -> DETECTOR CIEGO: FALLA. El orquestador no pudo leer su fuente de
      #        verdad (archivo ausente, vacio, sin tabla, o 0 modulos). Un
      #        «0 problemas» sobre un archivo vacio no es un aprobado: es «no
      #        mire». Fue el 7mo incidente de infra por agentes paralelos.
      - name: Verificar el orquestador (gate de ceguera)
        run: |
          set +e
          python scripts/verificar_checklist.py
          CODE=$?
          set -e
          echo "verificar_checklist.py -> exit $CODE"
          if [ "$CODE" -eq 3 ]; then
            echo "::error::DETECTOR CIEGO (exit 3): el orquestador no pudo leer CHECKLIST-GLOBAL.md. Restaurar desde HEAD antes de continuar (BUG-075)."
            exit 1
          fi
          if [ "$CODE" -eq 1 ]; then
            echo "::warning::Hay inconsistencias preexistentes en el protocolo (exit 1). Este gate cubre la CEGUERA (exit 3), no el contenido; el detalle se sigue en 11-BUGS.md."
          fi
          exit 0


  summary:
    name: Quality Gate Summary
    needs: [godot-lint, code-quality-script, formatting-check, test-suite, legal-tools, security-scan, encoding-guard, log-protocol, binary-guard, architecture-guard, checklist-orchestrator]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Quality gate summary:"
          echo "godot-lint: ${{ needs.godot-lint.result }}"
          echo "code-quality-script: ${{ needs.code-quality-script.result }}"
          echo "formatting-check: ${{ needs.formatting-check.result }}"
          echo "test-suite: ${{ needs.test-suite.result }}"
          echo "legal-tools: ${{ needs.legal-tools.result }}"
          echo "security-scan: ${{ needs.security-scan.result }}"
          echo "encoding-guard: ${{ needs.encoding-guard.result }}"
          echo "log-protocol: ${{ needs.log-protocol.result }}"
          echo "binary-guard: ${{ needs.binary-guard.result }}"
          echo "architecture-guard: ${{ needs.architecture-guard.result }}"
          echo "checklist-orchestrator: ${{ needs.checklist-orchestrator.result }}"
          if [[ "${{ needs.godot-lint.result }}" != "success" ]] || [[ "${{ needs.code-quality-script.result }}" != "success" ]] || [[ "${{ needs.formatting-check.result }}" != "success" ]] || [[ "${{ needs.test-suite.result }}" != "success" ]] || [[ "${{ needs.legal-tools.result }}" != "success" ]] || [[ "${{ needs.security-scan.result }}" != "success" ]] || [[ "${{ needs.encoding-guard.result }}" != "success" ]] || [[ "${{ needs.log-protocol.result }}" != "success" ]] || [[ "${{ needs.binary-guard.result }}" != "success" ]] || [[ "${{ needs.architecture-guard.result }}" != "success" ]] || [[ "${{ needs.checklist-orchestrator.result }}" != "success" ]]; then
            echo "::error::One or more quality checks failed"
            exit 1
          fi
          echo "All quality gates passed!"